<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Ashal Review</title>
  <style>
    :root {
      --primary: #12072b;
      --secondary: #32005c;
      --accent: #ffd700;
      --background: #09080e;
      --card-bg: #14121e;
      --text: #e6e6fa;
      --muted: #a09cb0;
      --border-glow: rgba(255, 215, 0, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--background);
      color: var(--text);
      line-height: 1.8;
      padding-bottom: 5rem;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--border-glow);
      padding-bottom: 1rem;
    }

    .header-bar h1 {
      color: var(--accent);
      font-size: 1.8rem;
    }

    .btn-back {
      background-color: var(--accent);
      color: var(--primary);
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: bold;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 2.5rem;
      border: 1px solid var(--border-glow);
      margin-bottom: 2rem;
    }

    .card-title {
      font-size: 1.8rem;
      color: var(--accent);
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <h1>Photo Gallery</h1>
      <a href="index.html" class="btn-back">← Back to Home</a>
    </div>

    <div class="card">
      <h2 class="card-title">Memories & Highlights</h2>
      <p>Add your content, photos, or extra thoughts here!</p>
    </div>
  </div>

</body>
</html>
